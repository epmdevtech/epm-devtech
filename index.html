    <!-- Theme Color: aplicado no frame 1 (antes do manifesto ser lido pelo browser).

    <!-- Anti-FOUC Script inline: sincroniza classe e data-theme no frame 0 -->
    <script>
      (function() {
        try {
          var storageKey = 'vite-ui-theme';
          var stored = localStorage.getItem(storageKey);
          var theme = stored || 'dark';
          var resolved = theme;
          if (theme === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(resolved);
          root.setAttribute('data-theme', resolved);
          root.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>

    <!-- CSS crítico inline: pinta o canvas e garante FCP imediato no frame 1.
         Contém APENAS o estritamente necessário para above-the-fold (header + hero). -->
    <style>
      :root {
        color-scheme: dark light;
      }
      html {
        background-color: #0A0F10;
        color: #F2F7F7;
        scroll-behavior: smooth;
        scroll-padding-top: 80px;
      }
      html.dark, html[data-theme="dark"] {
        background-color: #0A0F10;
        color: #F2F7F7;
      }
      html.light, html[data-theme="light"] {
        background-color: #F6FAFA;
        color: #0A0F10;
      }
      body {
        background-color: inherit;
        color: inherit;
        margin: 0;
        overflow-x: clip;
        max-width: 100%;
        font-family: Geist, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Header fixo visível imediatamente */
      header.fixed { position: fixed; top: 0; left: 0; right: 0; z-index: 50; }
      /* Hero: canvas ocupa a tela antes do JS renderizar */
      .hero-placeholder {
        min-height: 100vh;
        background: radial-gradient(circle at 50% 0%, rgba(45,212,191,0.08), transparent 60%);
        display: flex; align-items: center; justify-content: center;
      }
      /* Keyframe das animações CSS nativas usadas no Hero e Header */
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up { animation: fade-in-up 0.6s ease-out forwards; }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
      /* Título monocromático limpo */
      .text-gradient {
        color: #ffffff;
        -webkit-text-fill-color: #ffffff;
      }
      /* Glass effect do header */
      .glass {
        background: rgba(15,22,23,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      html.light .glass, html[data-theme="light"] .glass {
        background: rgba(255,255,255,0.85);
      }
      /* Skip-to-content acessível com alto contraste AAA */
      .skip-to-content {
        position: absolute;
        top: -100%;
        left: 1rem;
        z-index: 9999;
        padding: 0.75rem 1.5rem;
        background: #2DD4BF;
        color: #04201C;
        border-radius: 0.5rem;
        font-weight: 600;
        text-decoration: none;
        transition: top 0.2s;
      }
      .skip-to-content:focus { top: 1rem; }
    </style>
