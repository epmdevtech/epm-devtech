services:
  epm_dev_tech:
    image: node:20-alpine
    container_name: epm_dev_tech
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5213:5213"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"