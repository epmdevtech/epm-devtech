<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Code brackets stylized -->
  <rect x="10" y="15" width="70" height="70" rx="16" fill="url(#icon-bg)"/>
  
  <!-- Left bracket -->
  <path d="M38 32 L26 50 L38 68" stroke="#0A0F1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Right bracket -->
  <path d="M52 32 L64 50 L52 68" stroke="#0A0F1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Slash -->
  <line x1="48" y1="30" x2="42" y2="70" stroke="#0A0F1C" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Company Name -->
  <text x="95" y="48" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="32" fill="#E8EDF5" letter-spacing="2">
    EPM
  </text>
  <text x="95" y="48" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="32" fill="url(#accent-gradient)" letter-spacing="2" opacity="0">
    EPM
  </text>
  <text x="190" y="48" font-family="Inter, system-ui, sans-serif" font-weight="300" font-size="32" fill="#E8EDF5" letter-spacing="4">
    DEVTECH
  </text>
  
  <!-- Tagline -->
  <text x="95" y="72" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="11" fill="#6B7A99" letter-spacing="3.5" text-transform="uppercase">
    ENGENHARIA DE SOFTWARE
  </text>
  
  <!-- Accent line -->
  <rect x="95" y="78" width="50" height="2" rx="1" fill="url(#accent-gradient)"/>
</svg>